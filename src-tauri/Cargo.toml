[package]
name = "textpicker"
version = "0.1.0"
description = "Select text anywhere. Copy instantly."
authors = ["TextPicker contributors"]
license = "MIT"
rust-version = "1.85"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "textpicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-store = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.3"
thiserror = "2.0.21"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
tokio = { version = "1.53.2", features = ["time", "sync"] }
tauri-plugin-dialog = "2.7.3"
drag = "2.1.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# Only the framework modules we call, to keep build times down.
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "objc2-core-foundation",
  "NSApplication",
  "NSEvent",
  "NSGraphics",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFData",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2",
  "libc",
  "CGBitmapContext",
  "CGColorSpace",
  "CGContext",
  "CGDataProvider",
  "CGDirectDisplay",
  "CGError",
  "CGImage",
  "CGWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSLocale",
  "NSProcessInfo",
  "NSString",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CGImageSource", "CGImageProperties"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "libc",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "SCScreenshotManager",
  "SCShareableContent",
  "SCStream",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "VNObservation",
  "VNRecognizeTextRequest",
  "VNRequest",
  "VNRequestHandler",
  "VNTypes",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
png = "0.18.1"
